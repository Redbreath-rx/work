{% extends 'base.html' %}{% block content %}<section class="panel auth"><div class="eyebrow">民间故事资源库</div><h1>{{ '创建账号' if register else '欢迎回来' }}</h1><p class="muted">{{ '注册后即可收藏和管理个人收藏。' if register else '登录以收藏故事或管理资源。' }}</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>用户名<input name="username" required maxlength="30" autocomplete="username"></label><label>密码<input type="password" name="password" required minlength="8" maxlength="128" autocomplete="{{ 'new-password' if register else 'current-password' }}"></label><button class="wide">{{ '注册' if register else '登录' }}</button></form><p><a href="{{ url_for('login' if register else 'register') }}">{{ '已有账号？前往登录' if register else '还没有账号？注册' }}</a></p></section>{% endblock %}
