{% extends 'base.html' %}{% block content %}<div class="section-head"><div><div class="eyebrow">个人资源</div><h1>我的收藏</h1></div><span>{{ stories|length }} 条</span></div><section class="panel">{% for story in stories %}<div class="favorite-row"><div><span class="tag">{{ story.story_type }}</span><h3><a href="{{ url_for('detail',story_id=story._id) }}">{{ story.title }}</a></h3></div><form method="post" action="{{ url_for('toggle_favorite',story_id=story._id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="secondary">取消收藏</button></form></div>{% else %}<div class="empty">还没有收藏，去故事列表发现感兴趣的资源吧。</div>{% endfor %}</section>{% endblock %}
